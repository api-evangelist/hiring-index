components:
  securitySchemes:
    rapidApiKey:
      type: apiKey
      in: header
      name: x-rapidapi-key

  responses:
    BadRequest:
      description: No body, or a body that is not a JSON object
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: invalid_request
            message: the request has no body. Send a JSON object; {} is the filter that matches everything.
            meta:
              request_id: 7930fd0adc27ed3a6cde6a53ce338d2c
              took_ms: 0.07
    Unauthorized:
      description: |
        Missing or invalid key. Answered by the marketplace before the request
        reaches this API, in its own shape — `message` only, no `error`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MarketplaceError' }
    Forbidden:
      description: |
        A valid key without a subscription to this API. Answered by the
        marketplace, `message` only.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MarketplaceError' }
          example:
            message: You are not subscribed to this API.
    Unprocessable:
      description: |
        The filter is well-formed JSON but cannot be run. `error` is
        `invalid_request` (an unknown key or a malformed value — `message` names
        it and lists the valid keys) or `keyword_too_common` (a `keywords` term
        matches too many postings — `meta.estimated_matches` and `meta.limit` say
        by how much).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            unknownKey:
              summary: A key the API does not have
              value:
                error: invalid_request
                message: '''location_types'' is not a filter key. The keys are: cities, company_name, country_codes, days_ago, employment_type, handles, job_titles, keywords, limit, page, remote_flag, salary, seniority, source_platforms'
                meta:
                  request_id: de1bb62e86aa15134ec156b64dca09b8
                  took_ms: 0.16
            keywordTooCommon:
              summary: '{"keywords": ["experience"]}'
              value:
                error: keyword_too_common
                message: '''experience'' appears in about 64% of postings (~1,123,068 matches); keyword aggregates are computed for terms under 130,000 matches. Search the role with job_titles, or use a rarer keyword -- narrowing by city, country or employment type does not help: the term scan comes first.'
                meta:
                  term: experience
                  estimated_matches: 1123068
                  limit: 130000
                  request_id: 32c3863fafb59454773a444e7e782c7f
                  took_ms: 1.48
    RateLimited:
      description: Plan quota or rate limit exceeded. Answered by the marketplace; see its rate-limit headers.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MarketplaceError' }
    Busy:
      description: Capacity exhausted for the moment (`busy`), or the filter did not finish inside the statement deadline (`timeout`). Retry after `retry_after_seconds`, or narrow the filter.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Meta:
      type: object
      description: Present on every response of this API.
      properties:
        request_id:
          type: string
          description: Quote it when you contact support.
          example: be8374ea54b3756c61e55409f09e8075
        took_ms:
          type: number
          description: Server time in milliseconds — tells our part from the network's.
          example: 62.35

    Error:
      type: object
      description: Every error this API itself returns. Branch on `error`, not on `message`.
      required: [error, message]
      properties:
        error:
          type: string
          description: Short code for the client to branch on.
          example: invalid_request
          enum: [invalid_request, keyword_too_common, not_found, busy, timeout]
        message:
          type: string
          description: Human-readable explanation; wording may change.
        retry_after_seconds:
          type: integer
          description: '`busy` and `timeout` only: how long to wait before retrying — 1 second for `busy`, 2 for `timeout`.'
        meta:
          type: object
          properties:
            request_id: { type: string }
            took_ms: { type: number }
            term:
              type: string
              description: '`keyword_too_common` only: the keyword that was refused.'
            estimated_matches:
              type: integer
              description: '`keyword_too_common` only: roughly how many postings mention it.'
            limit:
              type: integer
              description: '`keyword_too_common` only: the ceiling a keyword must stay under.'

    MarketplaceError:
      type: object
      description: Shape of 401, 403 and 429, which the marketplace answers before the request reaches this API.
      properties:
        message: { type: string }

    SalaryFilter:
      type: object
      description: |
        Filter on the advertised pay band; only postings that disclose a salary
        can match. Amounts are never converted between currencies: `min` and `max`
        are compared with the band in the currency the posting advertises. Send
        `currency` to keep the comparison in one currency — without it a 60,000
        bound matches 60,000 euros, dollars and rupees alike.
      properties:
        min:
          type: number
          example: 60000
        max:
          type: number
          example: 90000
        currency:
          type: array
          items: { type: string }
          description: |
            ISO 4217 codes, any case. Keeps only postings advertised in these
            currencies. Nothing is converted.
          example: ["EUR"]
        period:
          type: array
          items: { type: string }
          description: |
            Pay period, as an array: `year`, `month`, `week`, `day` or `hour`. Always
            send it: without it a yearly bound is compared with hourly and monthly
            rates as bare numbers. Vendor spellings read from a response (`1 YEAR`,
            `bi-week-salary`, `one-time`) are accepted too; anything else is rejected
            with 422 `invalid_request`, and the message lists what is accepted.
          example: ["year"]
        match:
          type: string
          enum: [contains, overlaps]
          default: contains
          description: |
            How a posting's band has to meet your bounds. `contains` keeps only
            postings whose whole band sits inside them; `overlaps` keeps every
            posting whose band touches them — what a question like "which roles
            can pay me this" means.

    JobFilter:
      type: object
      description: |
        The filter `/jobs/search` and `/jobs/insights` share. Sent as the request
        body itself. An absent key and an empty array both mean "not applied";
        an unknown key is rejected with `422`. String lists match any of their
        values (OR).
      properties:
        job_titles:
          type: array
          items: { type: string, minLength: 3 }
          description: |
            Matched against the posting title only. Terms shorter than three
            characters are rejected.
          example: ["Data Engineer", "Analytics Engineer"]
        keywords:
          type: array
          items: { type: string, minLength: 3 }
          description: |
            Matched against the title or the description — a tool, a skill, a
            technology. Any keyword matches. A term found in more than about
            130,000 postings returns `422 keyword_too_common`.
          example: ["Kubernetes", "Terraform"]
        cities:
          type: array
          items: { type: string }
          description: City names as employers write them.
          example: ["Berlin", "Munich"]
        country_codes:
          type: array
          items: { type: string, minLength: 2, maxLength: 2 }
          description: |
            ISO 3166-1 alpha-2 codes, matched in either case. A country name such
            as "Germany" matches nothing — send `DE`.
          example: ["DE", "NL"]
        company_name:
          type: string
          description: |
            The employer name, matched whole and case-insensitively — no prefix or
            partial match. Some sources do not publish the employer at all; to pull
            one employer's own board, `handles` is the precise filter.
          example: Delivery Hero
        handles:
          type: array
          items: { type: string }
          description: ATS board handles, exactly as the `handle` field of a posting reports them.
          example: ["DeliveryHero"]
        remote_flag:
          type: array
          items: { type: string }
          description: |
            `["true"]` for remote postings, `["false"]` for on-site ones; vendor
            spellings such as `Remote` fold into `true`. Hybrid is not a filter
            value — read `hybrid_flag` on the returned rows.
          example: ["true"]
        employment_type:
          type: array
          items: { type: string }
          description: |
            Employment type as the vendor writes it, compared without regard to
            case: `Full-time` matches `Full-Time`, but not `FullTime`. To catch every
            spelling of one type, list them all — `employment_type_split` in an
            insights response shows which spellings a slice actually has. The slowest
            filter — a wide slice can take several seconds.
          example: ["Full-time"]
        seniority:
          type: array
          items: { type: string }
          description: Seniority as the `seniority` field of a posting reports it.
          example: ["Mid-Senior Level"]
        source_platforms:
          type: array
          items: { type: string }
          description: |
            The ATS a posting was read from: workday, smartrecruiters, greenhouse,
            workable, lever, ashby, recruitee, teamtailor, breezy, personio, hireology,
            pageup, zoho.
          example: ["greenhouse", "lever"]
        salary: { $ref: '#/components/schemas/SalaryFilter' }
        days_ago:
          type: integer
          minimum: 0
          description: |
            Published no earlier than N days ago, by `posted_at`. Postings without
            a publication date never match.
          example: 7

    SearchRequest:
      description: The shared filter plus paging.
      allOf:
        - $ref: '#/components/schemas/JobFilter'
        - type: object
          properties:
            page:
              type: integer
              minimum: 1
              maximum: 100
              default: 1
            limit:
              type: integer
              minimum: 1
              maximum: 100
              default: 25

    InsightsRequest:
      description: The shared filter plus the grouping options. `page` and `limit` are rejected here.
      allOf:
        - $ref: '#/components/schemas/JobFilter'
        - type: object
          properties:
            group_by:
              type: string
              enum: [city, city_only, country_code]
              description: |
                Return one block per location instead of one for the whole slice.
                `city` groups by city and country code, `city_only` by city name
                alone, `country_code` by country. A string, not an array. Send the
                locations to group in `cities` or `country_codes`.
            city_aliases:
              type: object
              additionalProperties: { type: string }
              description: |
                With `group_by: city` or `city_only`, folds alternative spellings into one group:
                each key is a spelling listed in `cities`, its value the city whose
                group it joins.
              example: { "Bangalore": "Bengaluru" }
            min_rows:
              type: integer
              minimum: 0
              description: With `group_by`, leave out groups with fewer rows than this. `0` returns every group.
            percentiles:
              type: boolean
              description: With `group_by`, add p25, p75 and p90 of posting age to each group's `freshness`.

    Salary:
      type: object
      description: |
        The pay the employer advertises, as the employer states it: numbers in
        the posting's own currency and period. `period` is the vendor's spelling
        (`1 YEAR`, `year`, `per-year-salary`, `month`, `1 HOUR` …). Either end of
        the band can be absent when the employer gives only one.
      properties:
        min: { type: number, example: 75000 }
        max: { type: number, example: 100000 }
        currency:
          type: string
          description: ISO 4217
          example: EUR
        period: { type: string, example: 1 YEAR }
        source:
          type: string
          description: Where the band was read from.
          example: vendor_field
        confidence:
          type: string
          example: stated

    Job:
      type: object
      description: |
        One posting. A field the source did not state is absent — never null,
        never an empty string. Location fields are flat: a posting listed in
        several places arrives as several rows that differ in `record_index`.
      required: [_id, source_platform, handle, source_job_id, record_index, title, first_seen_at, fetched_at, content_hash]
      properties:
        _id:
          type: string
          description: Stable id; pass it to `GET /jobs/{id}` verbatim.
          example: YXNoYnl8YWxtZWRpYXwxOGM1YmNhOS01MmM5LTRkZWMtOGJmYi1jNmUyNzZkYWNlZGF8MA
        source_platform:
          type: string
          description: The ATS the posting was read from.
          example: ashby
        handle:
          type: string
          description: The employer's board on that ATS — also a filter (`handles`).
          example: almedia
        source_job_id: { type: string, description: The posting's id on its ATS. }
        record_index:
          type: integer
          description: Which of the posting's locations this row is, from 0.
          example: 0
        requisition_id: { type: string, description: The employer's requisition number. }
        title: { type: string, example: Senior Growth Manager (Berlin) }
        company_name:
          type: string
          description: The employer as the source names it. Absent where the ATS does not publish it (Workday, often Ashby).
          example: Almedia
        description:
          type: string
          description: The posting body as the source publishes it (HTML).
        detail:
          type: object
          description: |
            A second read of the posting page, for sources whose listing omits
            fields. `filled` names the top-level fields it supplied.
          properties:
            fetched_at: { type: string, format: date-time }
            description: { type: string, description: The posting body from that page (HTML). }
            filled:
              type: array
              items: { type: string }
              example: ["country", "posting_url"]
        posted_at:
          type: string
          description: |
            The employer's publication date, normalised: `YYYY-MM-DD` or a full
            ISO 8601 timestamp, depending on how precisely the source states it.
            Absent when the source gives only a relative phrase.
          example: "2026-09-09T14:43:52.483+00:00"
        posted_at_raw:
          type: string
          description: The publication date exactly as the vendor wrote it.
          example: Posted 10 Sept 2026
        updated_at: { type: string, description: 'When the source last changed the posting, where it says.' }
        updated_at_raw: { type: string }
        posting_url:
          type: string
          format: uri
          description: The posting on the employer's ATS.
        apply_url:
          type: string
          format: uri
          description: The employer's own application form, where the source carries one.
        location_raw: { type: string, example: Berlin }
        city: { type: string, example: Berlin }
        region: { type: string, example: Berlin }
        country: { type: string, example: Germany }
        country_code:
          type: string
          description: ISO 3166-1 alpha-2, in the case the source wrote it (`DE`, `us`).
          example: DE
        postal_code: { type: string }
        street_address: { type: string }
        latitude: { type: string, description: 'Decimal degrees, as a string.' }
        longitude: { type: string, description: 'Decimal degrees, as a string.' }
        remote_flag:
          type: string
          description: |
            A string, not a boolean — usually `"true"` or `"false"`, sometimes the
            vendor's own word (`"remote"`). Test the value, not its truthiness.
          example: "false"
        hybrid_flag:
          type: string
          description: '`"true"` or `"false"`, as a string.'
        employment_type:
          type: string
          description: As the vendor writes it (`Full-time`, `FullTime`, `fulltime_permanent` …).
          example: FullTime
        seniority:
          type: string
          description: As the vendor writes it (`Mid-Senior Level`, `Associate`, `experienced` …).
        industry: { type: string }
        function: { type: string }
        department: { type: string, example: Growth }
        team: { type: string, example: Advertiser Growth }
        education_level: { type: string }
        language:
          type: string
          description: Language of the posting, ISO 639-1.
          example: en
        salary: { $ref: '#/components/schemas/Salary' }
        salary_text:
          type: string
          description: The pay line exactly as advertised.
          example: "€75K – €100K • Offers Equity • Offers Bonus"
        first_seen_at:
          type: string
          format: date-time
          description: When this index first saw the posting.
        fetched_at:
          type: string
          format: date-time
          description: When the source was last read. Sources are re-read daily.
        content_hash:
          type: string
          description: Hash of the posting content — changes when the posting changes.

    SearchResponse:
      type: object
      required: [jobs, total_count, company_count, page, limit, total_pages, meta]
      properties:
        jobs:
          type: array
          items: { $ref: '#/components/schemas/Job' }
        total_count:
          type: integer
          description: Rows matching the filter.
          example: 207
        company_count:
          type: integer
          description: Distinct named employers among them; rows without `company_name` are not counted.
          example: 33
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total_pages:
          type: integer
          description: Pages reachable at this `limit`, never more than 100.
          example: 11
        pages_truncated:
          type: object
          description: Present only when the filter matches more rows than 100 pages reach.
          properties:
            reachable_rows: { type: integer, example: 2000 }
            pages_if_unbounded: { type: integer, example: 33113 }
            why: { type: string }
        meta: { $ref: '#/components/schemas/Meta' }

    Bucket:
      type: object
      description: One value of a split and the number of rows carrying it.
      properties:
        value: { type: string, example: San Francisco }
        count: { type: integer, example: 1053 }

    CompanyBucket:
      type: object
      properties:
        company_name: { type: string, example: OpenAI }
        count: { type: integer, example: 124 }

    Percentiles:
      type: object
      properties:
        p25: { type: number }
        p50: { type: number }
        p75: { type: number }
        p90: { type: number }

    SalarySlice:
      type: object
      description: |
        Pay percentiles for one currency and pay period. `min` describes the lower
        ends of the advertised bands, `max` the upper ends. `period` is the
        vendor's spelling and is absent when the source gave none.
      properties:
        currency: { type: string, example: USD }
        period: { type: string, example: 1 YEAR }
        count:
          type: integer
          description: Disclosed salaries in this slice.
          example: 635
        min: { $ref: '#/components/schemas/Percentiles' }
        max: { $ref: '#/components/schemas/Percentiles' }

    Freshness:
      type: object
      description: Age of the postings in days, counted from `posted_at`; rows without a date are left out.
      properties:
        count:
          type: integer
          description: Rows with a publication date.
        median_days_live: { type: number, example: 98 }
        pct_last_7_days: { type: number, example: 5.6 }
        pct_over_60_days: { type: number, example: 63.1 }
        p25: { type: number, description: 'Grouped mode with `percentiles: true` only.' }
        p75: { type: number, description: 'Grouped mode with `percentiles: true` only.' }
        p90: { type: number, description: 'Grouped mode with `percentiles: true` only.' }

    Headline:
      type: object
      properties:
        row_count:
          type: integer
          description: Rows matching the filter.
          example: 1053
        job_count:
          type: integer
          description: Distinct postings — a posting listed in several places is one job and several rows.
          example: 1047
        company_count:
          type: integer
          description: Distinct named employers.
          example: 300
        with_salary: { type: integer, description: Rows that disclose a salary., example: 643 }
        with_posted_at: { type: integer, description: Rows with a publication date., example: 1053 }
        with_description: { type: integer, description: Rows with a description., example: 1004 }
        with_detail: { type: integer, description: Rows with a second read of the posting page., example: 46 }
        new_this_week:
          type: integer
          description: Rows first seen by this index in the last seven days.
          example: 59

    InsightsGroup:
      type: object
      description: |
        The blocks for one group. Carries the group's key (`city` and/or
        `country_code`, lower-cased), the counts of `Headline` except `job_count`
        and `company_count`, and the splits. `salary` is absent when no slice in
        the group reaches 30 disclosed salaries.
      properties:
        city: { type: string }
        country_code: { type: string, example: nl }
        row_count: { type: integer }
        with_salary: { type: integer }
        new_this_week: { type: integer }
        with_posted_at: { type: integer }
        with_description: { type: integer }
        with_detail: { type: integer }
        top_companies:
          type: array
          items: { $ref: '#/components/schemas/Bucket' }
        city_split: { type: array, items: { $ref: '#/components/schemas/Bucket' } }
        country_code_split: { type: array, items: { $ref: '#/components/schemas/Bucket' } }
        employment_type_split: { type: array, items: { $ref: '#/components/schemas/Bucket' } }
        remote_flag_split: { type: array, items: { $ref: '#/components/schemas/Bucket' } }
        seniority_split: { type: array, items: { $ref: '#/components/schemas/Bucket' } }
        platform_split: { type: array, items: { $ref: '#/components/schemas/Bucket' } }
        freshness: { $ref: '#/components/schemas/Freshness' }
        salary:
          type: array
          items: { $ref: '#/components/schemas/SalarySlice' }

    InsightsResponse:
      type: object
      description: |
        Without `group_by`: `headline` through `handle_split` at the top level.
        With `group_by`: only `group_by`, `groups` and `meta`.
      required: [meta]
      properties:
        headline: { $ref: '#/components/schemas/Headline' }
        salary:
          type: array
          description: One entry per currency and pay period; empty when no slice reaches 30 disclosed salaries.
          items: { $ref: '#/components/schemas/SalarySlice' }
        posted_at:
          type: object
          description: Posting age in days, counted from `posted_at`.
          properties:
            count: { type: integer }
            days_since_posted:
              type: object
              properties:
                p25: { type: number }
                p50: { type: number }
                p75: { type: number }
        freshness: { $ref: '#/components/schemas/Freshness' }
        top_companies:
          type: array
          items: { $ref: '#/components/schemas/CompanyBucket' }
        city_split: { type: array, items: { $ref: '#/components/schemas/Bucket' } }
        country_code_split:
          type: array
          description: The same country can appear twice, once per case the sources wrote it in (`DE`, `de`).
          items: { $ref: '#/components/schemas/Bucket' }
        employment_type_split: { type: array, items: { $ref: '#/components/schemas/Bucket' } }
        remote_flag_split: { type: array, items: { $ref: '#/components/schemas/Bucket' } }
        seniority_split: { type: array, items: { $ref: '#/components/schemas/Bucket' } }
        platform_split: { type: array, items: { $ref: '#/components/schemas/Bucket' } }
        handle_split: { type: array, items: { $ref: '#/components/schemas/Bucket' } }
        group_by:
          type: string
          enum: [city, city_only, country_code]
          description: Grouped mode only — echoes the request.
        groups:
          type: array
          description: Grouped mode only.
          items: { $ref: '#/components/schemas/InsightsGroup' }
        meta: { $ref: '#/components/schemas/Meta' }
