name: Hiring Index
description: >-
  Hiring Index is a jobs and labour-market data API that reads live postings straight from thirteen
  applicant tracking systems - Workday, SmartRecruiters, Greenhouse, Workable, Lever, Ashby, Recruitee,
  Teamtailor, Breezy, Personio, Hireology, PageUp and Zoho Recruit - behind one endpoint. Three
  operations search postings by title, keyword, location, salary, work arrangement and posting age;
  aggregate the same filter into salary percentiles, top employers and posting-age freshness; and
  fetch a single posting by id. A field the source did not state is absent rather than guessed, dates
  are the employer's own, and apply links point at the employer's ATS. A first-party MCP server and a
  Python client ship alongside the API, which is metered by results on RapidAPI.
